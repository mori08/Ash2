name: build-test

# push(main) は、PR を経ない chore コミットの検証と README バッジの更新のため
# paths-ignore はビルド結果に影響しないファイルのみ。.github/** は除外しない
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ideas/**'
      - '.claude/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ideas/**'
      - '.claude/**'
  workflow_dispatch:

env:
  SIV3D_VERSION: 0.6.16
  SIV3D_0_6_16: C:\OpenSiv3D_SDK_0.6.16

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # asset_list / Resource.rc は sync-assets.sh の生成物。
      # 生成物のコミット漏れは Release 実行時まで表面化しない（埋め込み漏れが throw になる）ため、
      # ビルドより前に検出する。--ignore-cr-at-eol は autocrlf による改行差での誤検知を避けるもの。
      - name: Check generated assets are in sync
        shell: bash
        run: |
          ./tools/sync-assets.sh
          git diff --exit-code --ignore-cr-at-eol -- Ash2/App/assets/asset_list Ash2/App/Resource.rc \
            || { echo "::error::生成物が最新ではありません。tools/sync-assets.sh を実行してコミットしてください。"; exit 1; }

      - name: Download Siv3D SDK
        shell: pwsh
        run: |
          bitsadmin /transfer s3d-download "https://siv3d.jp/downloads/Siv3D/manual/${{ env.SIV3D_VERSION }}/OpenSiv3D_SDK_${{ env.SIV3D_VERSION }}.zip" "C:\OpenSiv3D_SDK.zip"
          Expand-Archive -Path "C:\OpenSiv3D_SDK.zip" -DestinationPath "C:"

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: Ash2/vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('Ash2/vcpkg.json', 'Ash2/vcpkg-configuration.json') }}

      - name: Install vcpkg dependencies
        shell: pwsh
        working-directory: Ash2
        run: vcpkg install --triplet x64-windows "--x-install-root=$env:GITHUB_WORKSPACE\Ash2\vcpkg_installed\x64-windows"

      # ローカルの Visual Studio と同じく、MSBuild の vcpkg 統合で
      # entt の include パスを解決する（vcxproj には vcpkg のパスを書いていないため）
      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: vcpkg integrate install

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build (Debug)
        shell: pwsh
        run: |
          msbuild Ash2\Ash2.sln `
            -p:Configuration=Debug `
            -p:Platform=x64 `
            -m `
            -v:minimal `
            -nologo

      # Siv3D の初期化に失敗するとメッセージボックスでハングする可能性があるため、
      # ジョブ全体より短い timeout を個別に設定する
      - name: Run tests
        shell: bash
        timeout-minutes: 10
        run: ./tools/run-tests.sh

      # 出荷されるのは Release だが、Debug ビルドでは `_DEBUG` の #else 側
      # （Asset.hpp の埋め込みリソース経路・Debug.hpp の no-op な APP_LOG）が
      # 一度もコンパイルされない。その経路とリソースコンパイル・Release リンクを検証する。
      # テストは `_DEBUG` ガード内にあり Release には含まれないため、実行はしない。
      - name: Build (Release)
        shell: pwsh
        run: |
          msbuild Ash2\Ash2.sln `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -m `
            -v:minimal `
            -nologo
