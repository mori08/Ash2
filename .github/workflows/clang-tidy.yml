name: clang-tidy

on:
  schedule:
    - cron: '0 3 * * 3'  # 毎週水曜 12:00 JST
  workflow_dispatch:

permissions:
  security-events: write

env:
  SIV3D_VERSION: 0.6.16

jobs:
  clang-tidy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Siv3D SDK
        shell: pwsh
        run: |
          bitsadmin /transfer s3d-download "https://siv3d.jp/downloads/Siv3D/manual/${{ env.SIV3D_VERSION }}/OpenSiv3D_SDK_${{ env.SIV3D_VERSION }}.zip" "C:\OpenSiv3D_SDK.zip"
          Expand-Archive -Path "C:\OpenSiv3D_SDK.zip" -DestinationPath "C:"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: Ash2/vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('Ash2/vcpkg.json', 'Ash2/vcpkg-configuration.json') }}

      - name: Install vcpkg dependencies
        shell: pwsh
        working-directory: Ash2
        run: vcpkg install --triplet x64-windows "--x-install-root=$env:GITHUB_WORKSPACE\Ash2\vcpkg_installed\x64-windows"

      - name: Cache clang-tidy-sarif
        id: cache-sarif-tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clang-tidy-sarif.exe
          key: clang-tidy-sarif-v0.8.0

      - name: Install clang-tidy-sarif
        if: steps.cache-sarif-tool.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install clang-tidy-sarif --version 0.8.0 --locked

      - name: Run clang-tidy
        id: tidy
        shell: pwsh
        run: |
          $sdkRoot    = "C:\OpenSiv3D_SDK_${{ env.SIV3D_VERSION }}"
          $projectDir = "$env:GITHUB_WORKSPACE\Ash2"

          $tidyOpts = @(
            "--header-filter=.*Ash2[\\/](src|tests)[\\/].*"
          )

          $compileFlags = @(
            "--driver-mode=cl",
            "/EHsc",
            "/std:c++latest",
            "/Zc:__cplusplus",
            "/utf-8",
            "/FI$projectDir\src\stdafx.h",
            "-D_DEBUG",
            "-D_WINDOWS",
            "-D_ENABLE_EXTENDED_ALIGNED_STORAGE",
            "-D_SILENCE_CXX20_CISO646_REMOVED_WARNING",
            "-D_SILENCE_ALL_CXX23_DEPRECATION_WARNINGS",
            "-D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS",
            "-DUSE_TEST",
            "-I$projectDir\src",
            "-I$projectDir",
            "-imsvc", "$sdkRoot\include",
            "-imsvc", "$sdkRoot\include\ThirdParty",
            "-imsvc", "$projectDir\vcpkg_installed\x64-windows\x64-windows\include"
          )

          $rawLog = "$env:RUNNER_TEMP\clang-tidy.log"
          $hasWarnings = $false

          Get-ChildItem -Path "$projectDir\src", "$projectDir\tests" -Filter "*.cpp" -Recurse |
            Where-Object { $_.Name -ne "stdafx.cpp" } |
            ForEach-Object {
              Write-Host "Checking: $($_.Name)"
              $output = clang-tidy @tidyOpts $_.FullName '--' @compileFlags 2>&1
              $output | Write-Host
              $output | Out-File -FilePath $rawLog -Append -Encoding utf8
              if ($LASTEXITCODE -ne 0) { $hasWarnings = $true }
            }

          $result = if ($hasWarnings) { "failure" } else { "success" }
          "result=$result" >> $env:GITHUB_OUTPUT

      - name: Convert to SARIF
        shell: pwsh
        run: |
          # 警告の位置をリポジトリ相対パスに変換する（Code scanning はリポジトリ相対 URI を要求するため）
          $rawLog = "$env:RUNNER_TEMP\clang-tidy.log"
          $relLog = "$env:RUNNER_TEMP\clang-tidy-rel.log"
          $prefix = "$env:GITHUB_WORKSPACE\"

          $lines = if (Test-Path $rawLog) { Get-Content $rawLog } else { @() }
          $lines | ForEach-Object {
            if ($_ -match '^([A-Za-z]:\\[^:]+):\d+:\d+: ' -and $Matches[1].StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              $relPath = $Matches[1].Substring($prefix.Length).Replace('\', '/')
              $_.Replace($Matches[1], $relPath)
            } else {
              $_
            }
          } | Out-File -FilePath $relLog -Encoding utf8

          cmd /c "clang-tidy-sarif < `"$relLog`" > results.sarif"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: clang-tidy

      - name: Fail if warnings detected
        if: steps.tidy.outputs.result == 'failure'
        shell: pwsh
        run: |
          Write-Host "##[error]clang-tidy warnings detected. See the Security tab (Code scanning alerts) for details."
          exit 1
